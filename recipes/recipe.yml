---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue-deck
description: Custom Silverblue image forked from birdietx/silverblue with steam, gamescope and minimal tooling installed for gaming on Linux for htpc and handheld use.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: latest

modules:

  # See /files/system
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://negativo17.org/repos/fedora-multimedia.repo
        - https://negativo17.org/repos/fedora-rar.repo
      copr:
        enable:
          - ublue-os/bazzite
          - ublue-os/bazzite-multilib
          - ublue-os/packages
          - ublue-os/staging
          - ycollet/audinux

  - type: dnf
    install:
      packages:
        - terra-release-extras
        - terra-release-mesa
    repos:
      disable:
        - fedora-multimedia-debug
        - fedora-multimedia-source
        - fedora-rar-debug
        - fedora-rar-source
    remove:
      auto-remove: true
      packages:
        - firefox
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-common
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - nano-default-editor

  - type: script
    scripts:
      - dnf.sh
    snippets:
      - "dnf5 upgrade --allow-vendor-change --assumeyes --refresh"

  - type: dnf
    replace:
      - from-repo: terra-extras
        packages:
          - old: upower
            new: terra-upower
            allow-erasing: true
          - old: wireplumber
            new: terra-wireplumber
            allow-erasing: true
          - old: xorg-x11-server-Xwayland
            new: terra-xorg-x11-server-Xwayland

  # 706 MiB
  - type: dnf
    install:
      packages:
        - acpica-tools
        - acpid
        - alacritty
        - arimo-nerd-fonts
        - baobab
        - bat
        - bibata-cursor-theme
        - brave-browser
        - btop

  # 483 MiB
  - type: dnf
    install:
      packages:
        - cargo
        - cmatrix
        - decibels
        - dmemcg-booster
        - evtest
        - eza
        - fastfetch
        - fish
        - flatseal
        - g4music

  # 685 MiB
  - type: dnf
    install:
      packages:
        - google-arimo-fonts
        - google-droid-fonts-all
        - google-go-fonts
        - google-noto-fonts-all
        - google-noto-sans-hk-fonts
        - google-noto-serif-cjk-fonts
        - google-roboto-fonts
        - google-roboto-mono-fonts
        - google-roboto-slab-fonts
        - google-rubik-fonts
        - gnome-calculator
        - gnome-calendar
        - gnome-characters
        - gnome-chess
        - gnome-clocks
        - gnome-connections
        - gnome-font-viewer
        - gnome-logs
        - gnome-mahjongg
        - gnome-maps
        - gnome-mines
        - gnome-nibbles
        - gnome-rounded-blur
        - gnome-shell-extension-blur-my-shell
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-bazzite-menu
        - gnome-shell-extension-caffeine
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-just-perfection
        - gnome-sudoku
        - gnome-text-editor
        - gnome-weather
        - HandBrake-cli
        - hid-replay
        - jetbrains-mono-fonts-all
        - jetbrainsmono-nerd-fonts
        - kf6-kirigami-addons
        - loupe
        - material-icons-fonts
        - mc

  # 555 MiB
  - type: dnf
    install:
      packages:
        - mission-center
        - papers
        - papirus-icon-theme
        - plasma-breeze
        - powerbuttond
        - python-vdf
        - qt6-qtvirtualkeyboard
        - qt5ct
        - qt6ct
        - rar
        - rsms-inter-fonts
        - rsms-inter-vf-fonts
        - scx-scheds
        - scx-tools
        - sddm
        - setroubleshoot
        - showtime

  # 772 MiB
  - type: dnf
    install:
      packages:
        - signal-cli
        - simple-scan
        - snapshot
        - socat
        - starship
        - terminus-fonts
        - terminus-fonts-console
        - vim-default-editor
        - vpower
        - xorg-x11-server-Xvfb
        - xrandr
        - yazi
        - yt-dlp
        - zsh
        - zsh-autocomplete
        - zsh-autosuggestions
        - zsh-html
        - zsh-syntax-highlighting

  # 756 MiB
  - type: dnf
    install:
      packages:
        - steam

  # 405 MiB
  - type: dnf
    install:
      packages:
        - galileo-mura
        - inputplumber
        - jupiter-fan-control
        - jupiter-hw-support-btrfs
        - steam-notif-daemon
        - steamdeck-dsp
        - steamos-manager-powerstation
        - terra-mangohud
      exclude:
        - mangohud

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - deck.sh

  - type: systemd
    system:
      enabled:
        - bluebird-auto-update.timer
        - bluebird-autologin.service
        - bluebird-hardware-setup.service
        - dmemcg-booster-system.service
        - grub-config.service
        - inputplumber.service
        - pipewire-workaround.service
        - pipewire-sysconf.service
        - sddm.service
        - steamos-manager.service
        - wireplumber-sysconf.service
        - wireplumber-workaround.service
      disabled:
        - acpid.service
        - gdm.service
        - jupiter-biosupdate.service
        - jupiter-controller-update.service
        - jupiter-fan-control.service
        - NetworkManager-wait-online.service
        - powerstation.service
        - scx_loader.service
        - vpower.service
      masked:
        - bootc-fetch-apply-updates.timer
        - rpm-ostreed-automatic.timer
    user:
      enabled:
        - dmemcg-booster-user.service
        - steamos-manager.service
        - steamos-manager-configure-cecd.service
        - steamos-manager-session-cleanup.service
        - steamos-powerbuttond.service

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false
    update-interval: 7d
    update-wait-after-boot: 10m
    upgrade-interval: 7d
    upgrade-wait-after-boot: 30m

  - type: script
    scripts:
      - gshell.sh
    snippets:
      - "rm -f /usr/lib64/gnome-software/plugins-*/libgs_plugin_fedora-pkgdb-collections.so"
      - "plymouth-set-default-theme bgrt-mac-style"

  - type: dnf
    repos:
      disable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - fedora-rar
        - terra
        - terra-extras
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/bazzite
          - ublue-os/bazzite-multilib
          - ublue-os/packages
          - ublue-os/staging
          - ycollet/audinux

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.mattjakeman.ExtensionManager
          - com.saivert.pwvucontrol

  - type: dnf
    repos:
      disable:
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - terra
        - terra-extras
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/bazzite
          - ublue-os/bazzite-multilib
          - ublue-os/packages
          - ublue-os/staging

  - type: gschema-overrides
    include:
      - zz1-bluebird.gschema.override

  - type: bling
    install:
      - dconf-update-service

  - type: files
    files:
      - source: post
        destination: /

  - type: os-release
    properties:
      PRETTY_NAME: "Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME: "Bluebird Deck"

  - type: initramfs
  - type: signing